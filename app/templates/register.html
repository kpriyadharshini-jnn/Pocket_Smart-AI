{% extends "base.html" %}


{% block title %}
Register · PocketSmart AI
{% endblock %}


{% block content %}


<div class="auth-card">


    <p class="eyebrow">
        GET STARTED
    </p>


    <h1>
        Create Account
    </h1>


    <form id="registerForm">


        <label>

            Full Name

            <input
                name="full_name"
                required
                minlength="2"
            >

        </label>


        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                minlength="6"
                required
            >

        </label>


        <button
            class="btn primary"
            type="submit"
        >

            Register

        </button>


        <p
            id="formMessage"
            class="message"
        ></p>


    </form>


    <p>

        Already registered?

        <a href="/login">
            Login
        </a>

    </p>


</div>


{% endblock %}


{% block scripts %}

<script>

window.initAuthForm(
    "registerForm",
    "/api/auth/register",
    "/login"
);

</script>

{% endblock %}
