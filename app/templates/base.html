<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>


<header class="topbar">

    <a
        href="/"
        class="brand"
    >
        PocketSmart
        <span>AI</span>
    </a>


    <nav>

        {% if user %}

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/planner/home">
                Home
            </a>

            <a href="/planner/party">
                Party
            </a>

            <a href="/planner/jewelry">
                Jewelry
            </a>

            <a href="/history">
                History
            </a>

            <button
                id="logoutBtn"
                class="link-button"
            >
                Logout
            </button>

        {% else %}

            <a href="/login">
                Login
            </a>

            <a
                href="/register"
                class="nav-cta"
            >
                Get Started
            </a>

        {% endif %}

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    © PocketSmart AI

    <br>

    Budget-aware recommendations.
    Verify prices on destination platforms.

</footer>


<script src="/static/js/app.js"></script>


{% block scripts %}
{% endblock %}


</body>

</html>
